resources:
  jobs:
    cet_main_ready_streaming_runtime:
      name: 0xDSI CET Main-Ready Streaming Runtime
      tasks:
        - task_key: cet_streaming_main
          notebook_task:
            notebook_path: ../notebooks/0xDSI_CET_Databricks_main.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              source_table: ${var.source_table}
              checkpoint_base: ${var.checkpoint_base}
              buffer_retention_days: ${var.buffer_retention_days}
          libraries:
            - whl: ${var.wheel_path}

    cet_main_ready_kg_and_replay:
      name: 0xDSI CET Main-Ready KG Replay Ops
      tasks:
        - task_key: late_event_replay
          spark_python_task:
            python_file: ../jobs/late_event_replay_prod.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
        - task_key: recompute
          depends_on:
            - task_key: late_event_replay
          spark_python_task:
            python_file: ../jobs/recompute_trends_prod.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
        - task_key: replay_diff
          depends_on:
            - task_key: recompute
          spark_python_task:
            python_file: ../jobs/replay_diff_prod.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
        - task_key: materialize_temporal_kg
          depends_on:
            - task_key: replay_diff
          spark_python_task:
            python_file: ../jobs/materialize_temporal_kg_prod.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
        - task_key: state_ttl
          depends_on:
            - task_key: materialize_temporal_kg
          spark_python_task:
            python_file: ../jobs/state_ttl_prod.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
